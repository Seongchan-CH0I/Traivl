version: '3.8'

services:
  # 1. Cache: Redis
  redis:
    image: redis:latest
    container_name: travel_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - travel-network

  # 2. Route Engine: OSRM Backend (길찾기)
  osrm-backend:
    image: osrm/osrm-backend:latest
    container_name: traivl-osrm
    restart: always
    command: "osrm-routed --algorithm mld /data/kanto-latest.osrm"
    ports:
      - "5001:5000"
    volumes:
      - ./osrm-data:/data
    networks:
      - travel-network

  # 3. AI Layer: FastAPI (AI 엔진)
  ai-server:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: fastapi_server
    restart: always
    # DATABASE_URL(Supabase pgvector 접속 문자열)은 .env에서 주입한다.
    # environment:에 두면 env_file보다 우선순위가 높아 .env 값이 무시되므로 여기에 두지 않는다.
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - OSRM_URL=http://osrm-backend:5000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - osrm-backend
    volumes:
      - huggingface_data:/root/.cache/huggingface
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  huggingface_data:
