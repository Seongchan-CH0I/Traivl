version: '3.8'

services:
  # 1. Database: pgvector (여행 데이터 저장 및 벡터 검색)
  database:
    image: ankane/pgvector:latest
    container_name: traivl-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: traivldb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d # 초기 데이터 로드를 위해 폴더 단위 마운트 (공유 가능)
    networks:
      - travel-network

  # 2. Cache: Redis (AI 결과값 및 날씨/지도 데이터 캐싱)
  redis:
    image: redis:latest
    container_name: travel_redis
    ports:
      - "6379:6379"
    networks:
      - travel-network

  # 3. AI Layer: FastAPI (민혁 담당 - TSP 최적화 및 LLM 추론)
  ai-server:
    build: ./ai-engine
    container_name: fastapi_server
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - osrm-backend
    volumes:
      - ./ai-engine:/app # 실시간 반영(Hot Reload)용 마운트
      - huggingface_data:/root/.cache/huggingface # AI 모델 무한 다운로드 방지용 도커 공용 캐시 볼륨
    networks:
      - travel-network

  # 4. Web & API Layer: Next.js (성찬/주상 담당)
  front_backend:
    build: "./front_backend"
    container_name: nextjs_app
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - database
      - ai-server
      - redis
    volumes:
      - "./front_backend:/app" # 로컬 코드 수정 시 실시간 반영 (Hot Reload)
      - /app/node_modules # 컨테이너 내부의 모듈 보호
    environment:
      - NODE_ENV=development
    networks:
      - travel-network

  # 5. Route Engine: OSRM Backend (Local)
  osrm-backend:
    image: osrm/osrm-backend:latest
    container_name: traivl-osrm
    command: "osrm-routed --algorithm mld /data/kanto-latest.osrm"
    ports:
      - "5001:5000"
    volumes:
      - ./osrm-data:/data
    networks:
      - travel-network

networks:
  travel-network:
    driver: bridge

volumes:
  postgres_data:
  huggingface_data:
# End of docker-compose.yml
